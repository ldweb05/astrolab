[PHP]
; ----------------------------------------------------------------------
; ASTROLAB - PHP 8.3 SECURE & PERFORMANCE CONFIGURATION (Docker Engine)
; ----------------------------------------------------------------------

; --- 1. Sicurezza e Anonimato del Server ---
expose_php = Off                      ; Maschera la versione di PHP nelle intestazioni HTTP
allow_url_fopen = Off                 ; Disabilita l'apertura di URL remoti via file_get_contents (previene RFI/LFI)
allow_url_include = Off               ; Disabilita l'inclusione di file remoti via include/require
enable_dl = Off                       ; Disabilita il caricamento dinamico di estensioni PHP a runtime

; Funzioni di sistema pericolose disabilitate (Hardening)
disable_functions = exec, passthru, shell_exec, system, proc_open, popen, curl_multi_exec, parse_ini_file, show_source

; --- 2. Gestione Errori e Logging (Privacy-First) ---
display_errors = Off                  ; Non mostrare mai errori a schermo all'utente finale
display_startup_errors = Off          ; Non mostrare errori di avvio a schermo
error_reporting = E_ALL               ; Traccia tutti gli errori internamente
log_errors = On                       ; Attiva il logging degli errori
error_log = /proc/self/fd/2           ; Invia gli errori allo stderr di Docker (visibili con 'docker logs')

; --- 3. Risorse, Memoria ed Esecuzione ---
date.timezone = Europe/Rome
memory_limit = 256M                   ; Generoso per i calcoli della griglia geometrica a 0.5°
max_execution_time = 300              ; Permette alle ricerche complesse su griglia di completarsi senza timeout
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 2000

; --- 4. Configurazione FFI (Swiss Ephemeris / libswe) ---
[ffi]
ffi.enable = "preload"                ; Consigliato per la sicurezza in produzione.
; NOTA: Se carichi libswe direttamente negli script runtime PHP invece che precaricarlo al boot di Docker,
; modifica la riga sopra in: ffi.enable = "true"

; --- 5. Sessioni e Cookie Sicuri ---
[Session]
session.use_strict_mode = 1           ; Rifiuta ID di sessione non validi o non generati dal server
session.cookie_httponly = 1           ; Protegge il cookie di sessione da attacchi XSS
session.cookie_samesite = "Lax"       ; Protegge da attacchi CSRF
session.cookie_secure = 0             ; Ambiente locale HTTP; impostare a 1 sul VPS con HTTPS
session.use_only_cookies = 1
session.name = "ASTROSESSID"          ; Nome personalizzato per non rivelare che la sessione è di PHP (default è PHPSESSID)

; --- 6. OPcache (Prestazioni NATIVE per PHP 8.3) ---
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0       ; In produzione Docker elimina i controlli di modifica file velocizzando il codice
opcache.save_comments = 0             ; Rimuove i commenti dal bytecode PHP ottimizzando la memoria
