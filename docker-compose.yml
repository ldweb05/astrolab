name: astro-dss

services:

  astro-dss-web:
    build: .
    container_name: astro-dss-web
    restart: unless-stopped
    ports:
      - "8192:80"
    volumes:
      - ./www:/var/www/html
      - ./php-config/php.ini:/usr/local/etc/php/php.ini
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome
    depends_on:
      - astro-dss-db
    networks:
      - astro-dss-net

  astro-dss-db:
    image: postgres:16-alpine
    container_name: astro-dss-db
    restart: unless-stopped
    ports:
      - "5442:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome
    networks:
      - astro-dss-net

  astro-dss-adminer:
    image: adminer:latest
    container_name: astro-dss-adminer
    restart: unless-stopped
    ports:
      - "8193:8080"
    environment:
      - TZ=Europe/Rome
    depends_on:
      - astro-dss-db
    networks:
      - astro-dss-net

networks:
  astro-dss-net:
    driver: bridge
